name: Build and test

on:
  push:
    branches:
      - main
      - master
  pull_request:

env: 
  CARGO_TERM_COLOR: always
  CARGO_TERM_QUIET: true
  CARGO_OUTPUT_FORMAT: short
  LETMEIN_DISABLE_SECCOMP: 1
  LETMEIN_DEBUG_NFTABLES: 1
  IN_CI: true

jobs:
  # Job for push events - minimal verbosity
  test-minimal:
    name: Run tests (minimal verbosity)
    # Only run for push events, not for PRs
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container:
      image: rust:alpine
      options: --privileged --dns=8.8.8.8 --dns=8.8.4.4
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            curl \
            git \
            nftables \
            sudo \
            libcap \
            bash \
            openssl
        shell: sh
      
      - name: Initialize nftables environment
        run: |
          echo "Initializing nftables environment..."
          # Use exactly the same initialization as in the test script
          # Taken from the initialize_nftables() function in tests/run-tests.sh
          echo "Creating inet filter table and LETMEIN-INPUT chain"
          
          # Create the base table
          nft -e add table inet filter 2>/dev/null || true
          
          # Create the LETMEIN-INPUT chain used in the configuration
          nft -e add chain inet filter LETMEIN-INPUT { type filter hook input priority 100\; policy accept\; } 2>/dev/null || true
          
          # Display the current nftables configuration
          echo "Current nftables configuration:"
          nft list ruleset
        shell: sh
      
      - name: Run tests with minimal verbosity
        id: minimal-tests
        continue-on-error: true  # Allow the job to continue even if tests fail
        run: |
          chmod +x ./tests/test.sh
          chmod +x ./tests/run-tests.sh
          
          # Export SKIP_CLIPPY to avoid clippy issues
          export SKIP_CLIPPY=1
          
          # Run tests with minimal logging
          export LOG_LEVEL=minimal
          export RUST_LOG=error
          unset LETMEIN_DEBUG_NFTABLES
          
          # Run the tests
          ./tests/test.sh --ci knock close
        shell: sh

      - name: Set job status
        id: status
        if: steps.minimal-tests.outcome == 'failure'
        run: |
          echo "Minimal verbosity tests failed. A verbose test run will be triggered."
          exit 1
        shell: sh

  # Job that runs verbose tests when minimal tests fail or for PR
  test-verbose:
    name: Run tests (verbose mode)
    needs: [test-minimal]
    if: always() && (needs.test-minimal.result == 'failure' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    container:
      image: rust:alpine
      options: --privileged --dns=8.8.8.8 --dns=8.8.4.4
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug Container Environment
        run: |
          echo "PATH=$PATH"
          ls -la /bin || echo "/bin not accessible"
          /bin/sh -c "which sh" || echo "sh not found in PATH"
          /bin/sh -c "which bash" || echo "bash not found in PATH"
          find / -name sh 2>/dev/null || echo "No sh found"
          find / -name bash 2>/dev/null || echo "No bash found"
          cat /etc/os-release || echo "OS release info not available"
        shell: sh
      
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            curl \
            git \
            nftables \
            sudo \
            libcap \
            bash \
            openssl
        shell: sh
      
      - name: Initialize nftables environment
        run: |
          echo "Initializing nftables environment..."
          # Use exactly the same initialization as in the test script
          # Taken from the initialize_nftables() function in tests/run-tests.sh
          echo "Creating inet filter table and LETMEIN-INPUT chain"
          
          # Create the base table
          nft -e add table inet filter 2>/dev/null || true
          
          # Create the LETMEIN-INPUT chain used in the configuration
          nft -e add chain inet filter LETMEIN-INPUT { type filter hook input priority 100\; policy accept\; } 2>/dev/null || true
          
          # Display the current nftables configuration
          echo "Current nftables configuration:"
          nft list ruleset
        shell: sh
      
      - name: Run tests with maximum verbosity
        run: |
          chmod +x ./tests/test.sh
          chmod +x ./tests/run-tests.sh
          
          # Export SKIP_CLIPPY to avoid clippy issues
          export SKIP_CLIPPY=1
          
          # Set maximum verbosity
          export LOG_LEVEL=verbose
          export RUST_LOG=debug
          export RUST_BACKTRACE=full
          export LETMEIN_DEBUG_NFTABLES=1
          
          # Run the tests with verbose output
          ./tests/test.sh --ci knock close
        shell: sh

  # Direct verbose testing for PR only (avoiding the condition to wait for test-minimal)
  test-pr:
    name: Run tests (pull request)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: rust:alpine
      options: --privileged --dns=8.8.8.8 --dns=8.8.4.4
    steps:
      - uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            curl \
            git \
            nftables \
            sudo \
            libcap \
            bash \
            openssl
        shell: sh
      
      - name: Initialize nftables environment
        run: |
          echo "Initializing nftables environment..."
          # Use exactly the same initialization as in the test script
          # Taken from the initialize_nftables() function in tests/run-tests.sh
          echo "Creating inet filter table and LETMEIN-INPUT chain"
          
          # Create the base table
          nft -e add table inet filter 2>/dev/null || true
          
          # Create the LETMEIN-INPUT chain used in the configuration
          nft -e add chain inet filter LETMEIN-INPUT { type filter hook input priority 100\; policy accept\; } 2>/dev/null || true
          
          # Display the current nftables configuration
          echo "Current nftables configuration:"
          nft list ruleset
        shell: sh
      
      - name: Run tests with maximum verbosity (PR)
        run: |
          chmod +x ./tests/test.sh
          chmod +x ./tests/run-tests.sh
          
          # Export SKIP_CLIPPY to avoid clippy issues
          export SKIP_CLIPPY=1
          
          # Set maximum verbosity
          export LOG_LEVEL=verbose
          export RUST_LOG=debug
          export RUST_BACKTRACE=full
          export LETMEIN_DEBUG_NFTABLES=1
          
          # Run the tests with verbose output
          ./tests/test.sh --ci knock close
        shell: sh

