name: Build and test

on:
  push:
    branches:
      - main
      - master
  pull_request:

env: 
  CARGO_TERM_COLOR: always
  CARGO_TERM_QUIET: true
  CARGO_OUTPUT_FORMAT: short
  LETMEIN_DISABLE_SECCOMP: 1
  LETMEIN_DEBUG_NFTABLES: true
  IN_CI: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    container:
      image: rust:alpine
      options: --privileged --dns=8.8.8.8 --dns=8.8.4.4
    steps:
      - uses: actions/checkout@v4
      
      - name: Debug Container Environment
        run: |
          echo "PATH=$PATH"
          ls -la /bin || echo "/bin not accessible"
          /bin/sh -c "which sh" || echo "sh not found in PATH"
          /bin/sh -c "which bash" || echo "bash not found in PATH"
          find / -name sh 2>/dev/null || echo "No sh found"
          find / -name bash 2>/dev/null || echo "No bash found"
          cat /etc/os-release || echo "OS release info not available"
        shell: sh
      
      - name: Install dependencies
        run: |
          apk add --no-cache \
            build-base \
            curl \
            git \
            nftables \
            sudo \
            libcap \
            bash \
            openssl
        shell: sh
      
      - name: Initialize nftables environment
        run: |
          echo "Initializing nftables environment..."
          # Utilisez exactement la même initialisation que dans le script de test
          # Tiré de la fonction initialize_nftables() dans tests/run-tests.sh
          echo "Création de la table inet filter et de la chaîne LETMEIN-INPUT"
          
          # Créer la table de base
          nft -e add table inet filter 2>/dev/null || true
          
          # Créer la chaîne LETMEIN-INPUT utilisée dans la configuration
          nft -e add chain inet filter LETMEIN-INPUT { type filter hook input priority 100\; policy accept\; } 2>/dev/null || true
          
          # Afficher la configuration nftables actuelle
          echo "Configuration nftables actuelle:"
          nft list ruleset
        shell: sh
      
      - name: Run tests
        run: |
          pwd
          ls -la
          echo "Current directory contents:"
          ls -la .
          echo "Script permissions:"
          [ -f "./test.sh" ] && echo "File exists" || echo "File does not exist"
          [ -x "./test.sh" ] && echo "File is executable" || echo "File is not executable"
          file ./test.sh || echo "Cannot determine file type"
          head -n 1 ./test.sh || echo "Cannot read file"
          chmod +x ./test.sh
          
          # S'assurer que les scripts de test sont exécutables
          chmod +x ./tests/run-tests.sh
          
          # Exporter SKIP_CLIPPY pour éviter les problèmes de clippy
          export SKIP_CLIPPY=1
          
          # Exécuter les tests
          ./test.sh --ci knock close
        shell: sh



